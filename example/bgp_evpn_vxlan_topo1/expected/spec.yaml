nodes:
  - name: host1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: s1#eth0}]
    mounts: [$PWD/host1/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/host1/etc/frr/daemons:/etc/frr/daemons, $PWD/host1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: host2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: s4#eth0}]
    mounts: [$PWD/host2/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/host2/etc/frr/daemons:/etc/frr/daemons, $PWD/host2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: p1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: s2#eth0}, {name: eth1, type: direct, args: s3#eth0}]
    mounts: [$PWD/p1/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/p1/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/p1/etc/frr/daemons:/etc/frr/daemons, $PWD/p1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: pe1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: s1#eth1}, {name: eth1, type: direct, args: s2#eth1}]
    mounts: [$PWD/pe1/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/pe1/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/pe1/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/pe1/etc/frr/daemons:/etc/frr/daemons, $PWD/pe1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: pe2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: s3#eth1}, {name: eth1, type: direct, args: s4#eth1}]
    mounts: [$PWD/pe2/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/pe2/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/pe2/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/pe2/etc/frr/daemons:/etc/frr/daemons, $PWD/pe2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: pe3
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: s2#eth2}]
    mounts: [$PWD/pe3/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/pe3/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/pe3/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/pe3/etc/frr/daemons:/etc/frr/daemons, $PWD/pe3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: s1
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: host1#eth0}, {name: eth1, type: direct, args: pe1#eth0}]
    mounts: []
  - name: s2
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: p1#eth0}, {name: eth1, type: direct, args: pe1#eth1}, {name: eth2, type: direct, args: pe3#eth0}]
    mounts: []
  - name: s3
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: p1#eth1}, {name: eth1, type: direct, args: pe2#eth0}]
    mounts: []
  - name: s4
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: host2#eth0}, {name: eth1, type: direct, args: pe2#eth1}]
    mounts: []

node_configs:
  - name: host1
    cmds:
      - cmd: touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
  - name: host2
    cmds:
      - cmd: touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
  - name: p1
    cmds:
      - cmd: touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - cmd: sysctl -w net.ipv4.ip_forward=1
  - name: pe1
    cmds:
      - cmd: touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - cmd: sysctl -w net.ipv4.ip_forward=1
      - cmd: ip link add name br101 type bridge stp_state 0
      - cmd: ip addr add 10.10.0.2/24 dev br101
      - cmd: ip link set dev br101 up
      - cmd: ip link add vxlan101 type vxlan id 101 dstport 4789 local 10.255.0.2 nolearning
      - cmd: ip link set dev vxlan101 master br101
      - cmd: ip link set up dev vxlan101
      - cmd: ip link set dev eth0 master br101
  - name: pe2
    cmds:
      - cmd: touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - cmd: sysctl -w net.ipv4.ip_forward=1
      - cmd: ip link add name br101 type bridge stp_state 0
      - cmd: ip addr add 10.10.0.3/24 dev br101
      - cmd: ip link set dev br101 up
      - cmd: ip link add vxlan101 type vxlan id 101 dstport 4789 local 10.255.0.3 nolearning
      - cmd: ip link set dev vxlan101 master br101
      - cmd: ip link set up dev vxlan101
      - cmd: ip link set dev eth1 master br101
  - name: pe3
    cmds:
      - cmd: touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - cmd: sysctl -w net.ipv4.ip_forward=1
  - name: s1
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0
  - name: s2
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0
      - cmd: ip link set dev eth2 promisc on
      - cmd: ip link set dev eth2 master br0
  - name: s3
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0
  - name: s4
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0