name: bgp_evpn_vxlan_topo1
topology:
  nodes:
    host1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - host1/zebra.conf:/etc/frr/zebra.conf
      - host1/daemons:/etc/frr/daemons
      - host1/vtysh.conf:/etc/frr/vtysh.conf
      - host1/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
    host2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - host2/zebra.conf:/etc/frr/zebra.conf
      - host2/daemons:/etc/frr/daemons
      - host2/vtysh.conf:/etc/frr/vtysh.conf
      - host2/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
    p1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - p1/zebra.conf:/etc/frr/zebra.conf
      - p1/ospfd.conf:/etc/frr/ospfd.conf
      - p1/daemons:/etc/frr/daemons
      - p1/vtysh.conf:/etc/frr/vtysh.conf
      - p1/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
      - sysctl -w net.ipv4.ip_forward=1
    pe1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - pe1/zebra.conf:/etc/frr/zebra.conf
      - pe1/bgpd.conf:/etc/frr/bgpd.conf
      - pe1/ospfd.conf:/etc/frr/ospfd.conf
      - pe1/daemons:/etc/frr/daemons
      - pe1/vtysh.conf:/etc/frr/vtysh.conf
      - pe1/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
      - sysctl -w net.ipv4.ip_forward=1
      - ip link add name br101 type bridge stp_state 0
      - ip addr add 10.10.0.2/24 dev br101
      - ip link set dev br101 up
      - ip link add vxlan101 type vxlan id 101 dstport 4789 local 10.255.0.2 nolearning
      - ip link set dev vxlan101 master br101
      - ip link set up dev vxlan101
      - ip link set dev eth0 master br101
    pe2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - pe2/zebra.conf:/etc/frr/zebra.conf
      - pe2/bgpd.conf:/etc/frr/bgpd.conf
      - pe2/ospfd.conf:/etc/frr/ospfd.conf
      - pe2/daemons:/etc/frr/daemons
      - pe2/vtysh.conf:/etc/frr/vtysh.conf
      - pe2/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
      - sysctl -w net.ipv4.ip_forward=1
      - ip link add name br101 type bridge stp_state 0
      - ip addr add 10.10.0.3/24 dev br101
      - ip link set dev br101 up
      - ip link add vxlan101 type vxlan id 101 dstport 4789 local 10.255.0.3 nolearning
      - ip link set dev vxlan101 master br101
      - ip link set up dev vxlan101
      - ip link set dev eth1 master br101
    pe3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - pe3/zebra.conf:/etc/frr/zebra.conf
      - pe3/bgpd.conf:/etc/frr/bgpd.conf
      - pe3/ospfd.conf:/etc/frr/ospfd.conf
      - pe3/daemons:/etc/frr/daemons
      - pe3/vtysh.conf:/etc/frr/vtysh.conf
      - pe3/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
      - sysctl -w net.ipv4.ip_forward=1
    s1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    s2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
      - ip link set dev eth2 promisc on
      - ip link set dev eth2 master br0
    s3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    s4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0

  links:
  - endpoints: [host1:eth0, s1:eth0]
  - endpoints: [host2:eth0, s4:eth0]
  - endpoints: [p1:eth0, s2:eth0]
  - endpoints: [p1:eth1, s3:eth0]
  - endpoints: [pe1:eth0, s1:eth1]
  - endpoints: [pe1:eth1, s2:eth1]
  - endpoints: [pe2:eth0, s3:eth1]
  - endpoints: [pe2:eth1, s4:eth1]
  - endpoints: [pe3:eth0, s2:eth2]
