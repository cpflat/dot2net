name: ospf-topo1
topology:
  nodes:
    r1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r1/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r1/etc/frr/ospfd.conf:/etc/frr/ospfd.conf
      - r1/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r1/etc/frr/daemons:/etc/frr/daemons
      - r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r2/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r2/etc/frr/ospfd.conf:/etc/frr/ospfd.conf
      - r2/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r2/etc/frr/daemons:/etc/frr/daemons
      - r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r3/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r3/etc/frr/ospfd.conf:/etc/frr/ospfd.conf
      - r3/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r3/etc/frr/daemons:/etc/frr/daemons
      - r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r4/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r4/etc/frr/ospfd.conf:/etc/frr/ospfd.conf
      - r4/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r4/etc/frr/daemons:/etc/frr/daemons
      - r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    s1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    s2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    s3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
      - ip link set dev eth2 promisc on
      - ip link set dev eth2 master br0
    s4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    s5:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    s6:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0

  links:
  - endpoints: [r1:eth0, s1:eth0]
  - endpoints: [r1:eth1, s3:eth0]
  - endpoints: [r2:eth0, s2:eth0]
  - endpoints: [r2:eth1, s3:eth1]
  - endpoints: [r3:eth0, s3:eth2]
  - endpoints: [r3:eth1, s4:eth0]
  - endpoints: [r3:eth2, s5:eth0]
  - endpoints: [r4:eth0, s5:eth1]
  - endpoints: [r4:eth1, s6:eth0]
