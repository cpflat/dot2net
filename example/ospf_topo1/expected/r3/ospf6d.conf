router ospf6
 ospf6 router-id 10.0.255.3
 redistribute kernel
 redistribute connected
 redistribute static
!
router ospf6
 interface eth0 area 0.0.0.0
!
interface eth0
 ip ospf hello-interval 2
 ip ospf dead-interval 10
!
router ospf6
 interface eth1 area 0.0.0.0
!
interface eth1
 ip ospf hello-interval 2
 ip ospf dead-interval 10
!
router ospf6
 interface eth2 area 0.0.0.1
!
interface eth2
 ip ospf hello-interval 2
 ip ospf dead-interval 10
!