name: ospf_simple
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r1/frr.conf:/etc/frr/frr.conf
      - r1/daemons:/etc/frr/daemons
      - r1/vtysh.conf:/etc/frr/vtysh.conf

    r2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r2/frr.conf:/etc/frr/frr.conf
      - r2/daemons:/etc/frr/daemons
      - r2/vtysh.conf:/etc/frr/vtysh.conf

    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r3/frr.conf:/etc/frr/frr.conf
      - r3/daemons:/etc/frr/daemons
      - r3/vtysh.conf:/etc/frr/vtysh.conf

    sw1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    sw2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0

  links:
  - endpoints: [r1:eth0, r2:eth0]
  - endpoints: [r2:eth1, sw1:eth0]
  - endpoints: [sw1:eth1, r3:eth0]
  - endpoints: [r3:eth1, sw2:eth0]
