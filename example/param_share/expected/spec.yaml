nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: r2#eth0}]
    mounts: [$PWD/r1/frr.conf:/etc/frr/frr.conf, $PWD/r1/daemons:/etc/frr/daemons, $PWD/r1/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: r1#eth0}, {name: eth1, type: direct, args: sw1#eth0}]
    mounts: [$PWD/r2/frr.conf:/etc/frr/frr.conf, $PWD/r2/daemons:/etc/frr/daemons, $PWD/r2/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r3
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: sw1#eth1}, {name: eth1, type: direct, args: sw2#eth0}]
    mounts: [$PWD/r3/frr.conf:/etc/frr/frr.conf, $PWD/r3/daemons:/etc/frr/daemons, $PWD/r3/vtysh.conf:/etc/frr/vtysh.conf]
  - name: sw1
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r2#eth1}, {name: eth1, type: direct, args: r3#eth0}]
    mounts: []
  - name: sw2
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r3#eth1}]
    mounts: []

node_configs:
  - name: r1
    cmds:
      - cmd: 
  - name: r2
    cmds:
      - cmd: 
  - name: r3
    cmds:
      - cmd: 
  - name: sw1
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0
  - name: sw2
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0