name: host2
topology:
  nodes:
    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
      network-mode: none
      binds:
      - r3/frr.conf:/etc/frr/frr.conf
      - r3/daemons:/etc/frr/daemons
      - r3/vtysh.conf:/etc/frr/vtysh.conf

    r4:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
      network-mode: none
      binds:
      - r4/frr.conf:/etc/frr/frr.conf
      - r4/daemons:/etc/frr/daemons
      - r4/vtysh.conf:/etc/frr/vtysh.conf

    sw1_host2:
      kind: ovs-bridge

  links:
  - endpoints: [r3:eth0, sw1_host2:eth0]
  - endpoints: [r4:eth0, sw1_host2:eth1]

