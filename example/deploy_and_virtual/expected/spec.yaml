switches:
  - name: lan

nodes:
  - name: edge1
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: bridge, args: lan}, {name: eth1, type: direct, args: probe#eth0}]
    mounts: [$PWD/edge1/etc/net/net.conf:/etc/net/net.conf]
  - name: edge2
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: bridge, args: lan}]
    mounts: [$PWD/edge2/etc/net/net.conf:/etc/net/net.conf]
  - name: probe
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: edge1#eth1}]
    mounts: []

node_configs:
  - name: edge1
    cmds:
      - cmd: ip link set lo up
  - name: edge2
    cmds:
      - cmd: ip link set lo up