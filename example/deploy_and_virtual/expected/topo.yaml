name: deploy_and_virtual
topology:
  nodes:
    edge1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - edge1/etc/net/net.conf:/etc/net/net.conf
      exec:
      - ip link set lo up
    edge2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - edge2/etc/net/net.conf:/etc/net/net.conf
      exec:
      - ip link set lo up
    br-b3d7ed:
      kind: bridge
    probe:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none


  links:
  - endpoints: [edge1:eth0, br-b3d7ed:eth0-b3d7ed]
  - endpoints: [edge1:eth1, probe:eth0]
  - endpoints: [edge2:eth0, br-b3d7ed:eth1-b3d7ed]
