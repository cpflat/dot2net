# A site where not everything drawn is a container of ours, and not everything
# that is ours is ours to configure. Two questions get asked about every object
# and they are answered separately:
#
#   deploy  - what is this materialised as
#   virtual - does dot2net write its configuration
#
# The graph names five things and needs four different answers, which is the
# point of the topology: each form is here because the site has one, not to
# enumerate the values.
#
# Changing the graph: another router on the LAN needs nothing here. The overlay
# is the one part tied to the drawing - it is written for a link between two ends
# that build it themselves, so a second overlay needs a second pair of ends.

name: deploy_and_virtual

class_policy:
  interface:
    default: [addressed]

global:
  path: local

module_config:
  kathara:
    mount_dirs: [/etc/net]

# All three, on purpose. What each form turns into is decided per platform, so a
# topology that generated for one of them would not show that it was right.
module:
  - kathara
  - tinet
  - containerlab

file:
  - name: net.conf
    path: /etc/net/net.conf

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24

nodeclass:
  # Our own routers. deploy: container is the default and needs no writing.
  - name: router
    values:
      kind: linux
      image: nicolaka/netshoot
    interface_policy: [ip]
    config:
      - group: startup
        template:
          - "ip link set lo up"
      - file: net.conf
        template:
          - "# {{ .name }}"
          - "{{ .interfaces_addr }}"

  # The LAN both routers sit on. A shared medium is something every platform
  # already has, so asking for a container of our own would be asking for a
  # worse version of it: deploy: platform takes the platform's.
  - name: shared_lan
    deploy: platform
    values:
      kind: bridge

  # The upstream router, sharing the LAN with ours. It is a real router in a
  # real network, run by someone else - we neither start it nor configure it.
  - name: upstream
    deploy: none
    # It takes part in the addressing like any other member of the LAN: the
    # address it holds is one no other device is given. That is what drawing it
    # buys, and the only thing deploy: none leaves behind.
    interface_policy: [ip]

  # An appliance that arrives configured: a probe, a vendor image, anything set
  # up before it ever reaches the lab. It is started like any other node, and
  # dot2net writes nothing into it.
  - name: preconfigured
    deploy: container
    virtual: true

interfaceclass:
  # No policy here: which interfaces get an address is the node's decision
  # (router carries interface_policy), which is what keeps the LAN's own ports
  # out of the addressing and lets a search for a segment pass through it.
  - name: addressed
    config:
      - name: addr
        node: router
        template:
          - "address {{ .name }} {{ .ip_addr }}/{{ .ip_plen }}"

  # An end of the overlay. Its form comes from the connection, so it is not
  # written here; what is written is a name of its own, which keeps it out of the
  # run of numbers the platform's own interfaces are named from.
  - name: vxlan
    prefix: vx
    config:
      # The same block name the addressed class uses, so that the node gathers
      # both without knowing which kind of interface it got.
      - name: addr
        template:
          - "tunnel {{ .name }}"

  # Wired like any other port, and silent: the appliance on the far end
  # addresses this link itself. virtual withholds the configuration, not the
  # parameters - the address is still assigned, and still consumed.
  - name: unmanaged
    deploy: link
    virtual: true

connectionclass:
  # The overlay. Both ends are real devices that the routers build for
  # themselves, and no platform lays anything between them.
  - name: overlay
    deploy: logical
