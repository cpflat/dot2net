name: rip-topo1
topology:
  nodes:
    r1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r1/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r1/etc/frr/ripd.conf:/etc/frr/ripd.conf
      - r1/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r1/etc/frr/daemons:/etc/frr/daemons
      - r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r2/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r2/etc/frr/ripd.conf:/etc/frr/ripd.conf
      - r2/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r2/etc/frr/daemons:/etc/frr/daemons
      - r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r3/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r3/etc/frr/ripd.conf:/etc/frr/ripd.conf
      - r3/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r3/etc/frr/daemons:/etc/frr/daemons
      - r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log && chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    sw1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    sw3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    sw4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw5:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw6:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0

  links:
  - endpoints: [r1:eth0, sw1:eth0]
  - endpoints: [r1:eth1, sw2:eth0]
  - endpoints: [r1:eth2, sw5:eth0]
  - endpoints: [r1:eth3, sw6:eth0]
  - endpoints: [r2:eth0, sw2:eth1]
  - endpoints: [r2:eth1, sw3:eth0]
  - endpoints: [r3:eth0, sw3:eth1]
  - endpoints: [r3:eth1, sw4:eth0]
