name: rip-topo1
topology:
  nodes:
    r1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r1/zebra.conf:/etc/frr/zebra.conf
      - r1/ripd.conf:/etc/frr/ripd.conf
      - r1/staticd.conf:/etc/frr/staticd.conf
      - r1/daemons:/etc/frr/daemons
      - r1/vtysh.conf:/etc/frr/vtysh.conf
      - r1/frr.log:/var/log/frr.log

    r2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r2/zebra.conf:/etc/frr/zebra.conf
      - r2/ripd.conf:/etc/frr/ripd.conf
      - r2/staticd.conf:/etc/frr/staticd.conf
      - r2/daemons:/etc/frr/daemons
      - r2/vtysh.conf:/etc/frr/vtysh.conf
      - r2/frr.log:/var/log/frr.log

    r3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r3/zebra.conf:/etc/frr/zebra.conf
      - r3/ripd.conf:/etc/frr/ripd.conf
      - r3/staticd.conf:/etc/frr/staticd.conf
      - r3/daemons:/etc/frr/daemons
      - r3/vtysh.conf:/etc/frr/vtysh.conf
      - r3/frr.log:/var/log/frr.log

    sw1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    sw3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
    sw4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw5:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw6:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0

  links:
  - endpoints: [r1:eth0, sw1:eth0]
  - endpoints: [r1:eth1, sw2:eth0]
  - endpoints: [r1:eth2, sw5:eth0]
  - endpoints: [r1:eth3, sw6:eth0]
  - endpoints: [r2:eth0, sw2:eth1]
  - endpoints: [r2:eth1, sw3:eth0]
  - endpoints: [r3:eth0, sw3:eth1]
  - endpoints: [r3:eth1, sw4:eth0]
