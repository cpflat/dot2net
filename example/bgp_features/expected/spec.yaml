nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: sw0#eth0}, {name: eth1, type: direct, args: sw2#eth0}, {name: eth2, type: direct, args: sw4#eth0}, {name: eth3, type: direct, args: sw6#eth0}]
    mounts: [$PWD/r1/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r1/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/r1/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/r1/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r1/etc/frr/daemons:/etc/frr/daemons, $PWD/r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: sw0#eth1}, {name: eth1, type: direct, args: sw1#eth0}, {name: eth2, type: direct, args: sw5#eth0}, {name: eth3, type: direct, args: sw7#eth0}]
    mounts: [$PWD/r2/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r2/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/r2/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/r2/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r2/etc/frr/daemons:/etc/frr/daemons, $PWD/r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r3
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: sw1#eth1}, {name: eth1, type: direct, args: sw2#eth1}, {name: eth2, type: direct, args: sw8#eth0}]
    mounts: [$PWD/r3/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r3/etc/frr/ospfd.conf:/etc/frr/ospfd.conf, $PWD/r3/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r3/etc/frr/daemons:/etc/frr/daemons, $PWD/r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r4
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: sw4#eth1}, {name: eth1, type: direct, args: sw9#eth0}]
    mounts: [$PWD/r4/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r4/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/r4/etc/frr/daemons:/etc/frr/daemons, $PWD/r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r5
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: sw10#eth0}, {name: eth1, type: direct, args: sw5#eth1}]
    mounts: [$PWD/r5/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r5/etc/frr/bgpd.conf:/etc/frr/bgpd.conf, $PWD/r5/etc/frr/daemons:/etc/frr/daemons, $PWD/r5/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: sw0
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r1#eth0}, {name: eth1, type: direct, args: r2#eth0}]
    mounts: []
  - name: sw1
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r2#eth1}, {name: eth1, type: direct, args: r3#eth0}]
    mounts: []
  - name: sw10
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r5#eth0}]
    mounts: []
  - name: sw2
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r1#eth1}, {name: eth1, type: direct, args: r3#eth1}]
    mounts: []
  - name: sw4
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r1#eth2}, {name: eth1, type: direct, args: r4#eth0}]
    mounts: []
  - name: sw5
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r2#eth2}, {name: eth1, type: direct, args: r5#eth1}]
    mounts: []
  - name: sw6
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r1#eth3}]
    mounts: []
  - name: sw7
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r2#eth3}]
    mounts: []
  - name: sw8
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r3#eth2}]
    mounts: []
  - name: sw9
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r4#eth1}]
    mounts: []

node_configs:
  - name: r1
    cmds:
      - cmd: touch /var/log/frr.log
      - cmd: chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
  - name: r2
    cmds:
      - cmd: touch /var/log/frr.log
