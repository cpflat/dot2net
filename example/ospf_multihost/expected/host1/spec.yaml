switches:
  - name: br1

nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.4
    interfaces: [{name: net0, type: direct, args: r2#net1}]
    mounts: [r1/frr.conf:/etc/frr/frr.conf, r1/daemons:/etc/frr/daemons, r1/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.4
    interfaces: [{name: net0, type: bridge, args: br1}, {name: net1, type: direct, args: r1#net0}]
    mounts: [r2/frr.conf:/etc/frr/frr.conf, r2/daemons:/etc/frr/daemons, r2/vtysh.conf:/etc/frr/vtysh.conf]

node_configs:
  - name: r1
    cmds:
      - cmd: 
  - name: r2
    cmds:
      - cmd: 