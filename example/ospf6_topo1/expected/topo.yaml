name: ospf6-topo1
topology:
  nodes:
    r1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r1/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r1/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r1/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r1/etc/frr/daemons:/etc/frr/daemons
      - r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      - r1/var/log/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
    r2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r2/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r2/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r2/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r2/etc/frr/daemons:/etc/frr/daemons
      - r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      - r2/var/log/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
    r3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r3/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r3/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r3/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r3/etc/frr/daemons:/etc/frr/daemons
      - r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      - r3/var/log/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
    r4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      binds:
      - r4/etc/frr/zebra.conf:/etc/frr/zebra.conf
      - r4/etc/frr/staticd.conf:/etc/frr/staticd.conf
      - r4/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf
      - r4/etc/frr/daemons:/etc/frr/daemons
      - r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      - r4/var/log/frr.log:/var/log/frr.log
      exec:
      - chown frr:frr /var/log/frr.log
    sw1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw2:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
    sw5:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0
      - ip link set dev eth2 promisc on
      - ip link set dev eth2 master br0
    sw6:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set dev eth0 promisc on
      - ip link set dev eth0 master br0
      - ip link set dev eth1 promisc on
      - ip link set dev eth1 master br0

  links:
  - endpoints: [r1:eth0, sw1:eth0]
  - endpoints: [r1:eth1, sw5:eth0]
  - endpoints: [r2:eth0, sw2:eth0]
  - endpoints: [r2:eth1, sw5:eth1]
  - endpoints: [r3:eth0, sw3:eth0]
  - endpoints: [r3:eth1, sw5:eth2]
  - endpoints: [r3:eth2, sw6:eth0]
  - endpoints: [r4:eth0, sw4:eth0]
  - endpoints: [r4:eth1, sw6:eth1]
