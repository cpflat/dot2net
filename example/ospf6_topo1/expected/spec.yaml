nodes:
  - name: r1
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: sw1#eth0}, {name: eth1, type: direct, args: sw5#eth0}]
    mounts: [$PWD/r1/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r1/etc/frr/staticd.conf:/etc/frr/staticd.conf, $PWD/r1/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r1/etc/frr/daemons:/etc/frr/daemons, $PWD/r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf, $PWD/r1/var/log/frr.log:/var/log/frr.log]
  - name: r2
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: sw2#eth0}, {name: eth1, type: direct, args: sw5#eth1}]
    mounts: [$PWD/r2/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r2/etc/frr/staticd.conf:/etc/frr/staticd.conf, $PWD/r2/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r2/etc/frr/daemons:/etc/frr/daemons, $PWD/r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf, $PWD/r2/var/log/frr.log:/var/log/frr.log]
  - name: r3
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: sw3#eth0}, {name: eth1, type: direct, args: sw5#eth2}, {name: eth2, type: direct, args: sw6#eth0}]
    mounts: [$PWD/r3/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r3/etc/frr/staticd.conf:/etc/frr/staticd.conf, $PWD/r3/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r3/etc/frr/daemons:/etc/frr/daemons, $PWD/r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf, $PWD/r3/var/log/frr.log:/var/log/frr.log]
  - name: r4
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: sw4#eth0}, {name: eth1, type: direct, args: sw6#eth1}]
    mounts: [$PWD/r4/etc/frr/zebra.conf:/etc/frr/zebra.conf, $PWD/r4/etc/frr/staticd.conf:/etc/frr/staticd.conf, $PWD/r4/etc/frr/ospf6d.conf:/etc/frr/ospf6d.conf, $PWD/r4/etc/frr/daemons:/etc/frr/daemons, $PWD/r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf, $PWD/r4/var/log/frr.log:/var/log/frr.log]
  - name: sw1
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r1#eth0}]
    mounts: []
  - name: sw2
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r2#eth0}]
    mounts: []
  - name: sw3
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r3#eth0}]
    mounts: []
  - name: sw4
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r4#eth0}]
    mounts: []
  - name: sw5
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r1#eth1}, {name: eth1, type: direct, args: r2#eth1}, {name: eth2, type: direct, args: r3#eth1}]
    mounts: []
  - name: sw6
    image: nicolaka/netshoot
    interfaces: [{name: eth0, type: direct, args: r3#eth2}, {name: eth1, type: direct, args: r4#eth1}]
    mounts: []

node_configs:
  - name: r1
    cmds:
      - cmd: chown frr:frr /var/log/frr.log
  - name: r2
    cmds:
      - cmd: chown frr:frr /var/log/frr.log
  - name: r3
    cmds:
      - cmd: chown frr:frr /var/log/frr.log
  - name: r4
    cmds:
      - cmd: chown frr:frr /var/log/frr.log
  - name: sw1
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
  - name: sw2
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
  - name: sw3
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
  - name: sw4
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
  - name: sw5
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0
      - cmd: ip link set dev eth2 promisc on
      - cmd: ip link set dev eth2 master br0
  - name: sw6
    cmds:
      - cmd: ip link add br0 type bridge
      - cmd: ip link set br0 up
      - cmd: ip link set dev eth0 promisc on
      - cmd: ip link set dev eth0 master br0
      - cmd: ip link set dev eth1 promisc on
      - cmd: ip link set dev eth1 master br0