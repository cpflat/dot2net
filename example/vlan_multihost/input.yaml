# Multi-host output: the routers are split across two hosts, and everything
# belonging to a host is written below that host's directory so it can be
# packed as a unit.
#
# What this scenario is here to verify:
#   - global.output_group_class puts node files under their group's directory
#   - a group-scope file, and a group aggregating only its own members
#     (the r2--r3 link crosses the boundary and appears in neither host file)
#   - segment classes attached through "segment#" relational labels, their
#     values, and a per-segment parameter (vlan_id)
#   - network-scope files staying at the output root, since they belong to no
#     single host
#   - xlabel carrying class labels on edges and subgraphs
#   - a switch node: a shared L2 domain the platform realizes itself, emitted as
#     a bridge by containerlab and as a switches: entry by TiNET. Contrast with
#     example/switching, which realizes its switch as a container instead.
# The assert module pins that the classes above really are applied; without it
# a class that stops matching just disappears from the output and the expected
# files record its absence.
name: vlan_multihost

global:
  path: local
  # Files of a node in a "worker" group are written below that group.
  output_group_class: worker

module:
  - assert
  - tinet
  - containerlab

file:
  - name: host.yaml
    scope: group
  - name: segments.txt
    scope: network
  - name: frr.conf
    path: /etc/frr/frr.conf

class_policy:
  node:
    # sw_inter is provided by the platform, so no container is generated for it.
    switch: [platform_sw]
  interface:
    default: [default]
  connection:
    default: [link]

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24

param_rule:
  - name: vlan_id
    assign: segment
    layer: ip
    min: 100
    max: 1001

nodeclass:
  - name: router
    interface_policy: [ip]
    values:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      assert_used: "true"
    config:
      - name: startup
        blocks:
          after: ["interfaces_addr"]
        template: []
      - file: frr.conf
        template:
          - "hostname {{ .name }}"
      - name: node_entry
        template:
          - "  - {{ .name }}"

  # The platform provides this one, so it carries no image and no config: only
  # the kind, whose value containerlab owns and dot2net passes through.
  - name: platform_sw
    values:
      kind: ovs-bridge
      assert_used: "true"

interfaceclass:
  - name: default
    values:
      assert_used: "true"
    config:
      - name: addr
        # Only routers get an address: the switch is layer-unaware, which is
        # also what lets searchSegments look through it.
        node: router
        template:
          - "ip addr add {{ .ip_addr }}/{{ .ip_plen }} dev {{ .name }}"

connectionclass:
  - name: link
    values:
      assert_used: "true"
    config:
      - name: link_entry
        template:
          - "  - {{ .name }}"

groupclass:
  - name: worker
    values:
      assert_used: "true"
    config:
      - file: host.yaml
        template:
          - "host: {{ .name }}"
          - "nodes:"
          - "{{ .nodes_node_entry }}"
          - "links:"
          - "{{ .connections_link_entry }}"

segmentclass:
  - name: intra
    layer: ip
    params: [vlan_id]
    values:
      assert_used: "true"
      reach: intra-host
    config:
      - name: seg_entry
        template:
          - "{{ .name }} vlan={{ .vlan_id }} reach={{ .reach }}"
  - name: inter
    layer: ip
    params: [vlan_id]
    values:
      assert_used: "true"
      reach: inter-host
    config:
      - name: seg_entry
        template:
          - "{{ .name }} vlan={{ .vlan_id }} reach={{ .reach }}"

networkclass:
  - name: _default
    config:
      - file: segments.txt
        template:
          - "{{ .segments_ip_seg_entry }}"
