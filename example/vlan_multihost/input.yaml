# Multi-host output: the routers are split across two hosts, and everything
# belonging to a host is written below that host's directory so it can be
# packed as a unit.
#
# What this scenario is here to verify:
#   - global.output_group_class puts node files under their group's directory
#   - a group-scope file, and a group aggregating only its own members
#     (the r2--r3 link crosses the boundary and appears in neither host file)
#   - segment classes attached through "segment#" relational labels, their
#     values, and a per-segment parameter (vlan_id)
#   - network-scope files staying at the output root, since they belong to no
#     single host
#   - xlabel carrying class labels on edges and subgraphs
#   - a switch node: a shared L2 domain the platform realizes itself, emitted as
#     a bridge by containerlab and as a switches: entry by TiNET. Contrast with
#     example/switching, which realizes its switch as a container instead.
#   - use:, which pulls a ready-made class out of a module (see platform_sw)
#   - worker groups: containerlab writes one topo.yaml per machine, holding only
#     the nodes of that machine and the links it can wire with veth
#   - boundary_crossing_connection_class: the one link that leaves a machine
#     is found from the subgraphs, not annotated on the edge, and is listed in
#     inter-host-links.txt
#
# The two bridges are joined outside the lab - by a VLAN between the machines -
# so no topology file contains that link, and inter-host-links.txt is what tells
# the operator to make it. The address assignment still sees one segment across
# both machines, because a search for a segment passes through bridges. TiNET
# splits the same way: each machine gets its own spec.yaml holding its own nodes,
# and the crossing link is absent from both.
# The assert module pins that the classes above really are applied; without it
# a class that stops matching just disappears from the output and the expected
# files record its absence.
name: vlan_multihost

global:
  path: local
  # Which grouping the directory layout follows. Here it is the same class that
  # marks the machines, so a machine's files pack as one directory - but the
  # setting is independent of that: splitting the output by AS while deploying
  # per machine would be written the same way.
  output_group_class: worker

module:
  - assert
  - tinet
  - containerlab

file:
  - name: host.yaml
    scope: group
  - name: segments.txt
    scope: network
  - name: inter-host-links.txt
    scope: network
  - name: frr.conf
    path: /etc/frr/frr.conf

class_policy:
  interface:
    default: [default]
  connection:
    default: [link]

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24

param_rule:
  - name: vlan_id
    assign: segment
    layer: ip
    min: 100
    max: 1001

nodeclass:
  - name: router
    interface_policy: [ip]
    values:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      assert_used: "true"
    config:
      - name: startup
        blocks:
          after: ["interfaces_addr"]
        template: []
      - file: frr.conf
        template:
          - "hostname {{ .name }}"
      - name: node_entry
        template:
          - "  - {{ .name }}"

  # The platform provides this one, so no container is generated for it: it
  # carries no image and no config, only the kind, whose value containerlab
  # owns and dot2net passes through.
  - name: platform_sw
    deploy: platform
    values:
      kind: ovs-bridge
      assert_used: "true"
    # containerlab refuses to deploy when the bridge does not already exist, so
    # the script below has to create it. clabOvsBridgeSetup is a ready-made
    # class the containerlab module offers for that; a lab whose bridges are
    # provisioned by Ansible, or need sudo, or live in another OVS database,
    # simply drops the use: line and writes its own clab_bridge_setup template.
    # TiNET and Kathara create their bridges themselves and ignore all of this.
    use: [clabOvsBridgeSetup]

interfaceclass:
  - name: default
    values:
      assert_used: "true"
    config:
      - name: addr
        # Only routers get an address: the switch is layer-unaware, which is
        # also what lets searchSegments look through it.
        node: router
        template:
          - "ip addr add {{ .ip_addr }}/{{ .ip_plen }} dev {{ .name }}"

connectionclass:
  - name: link
    values:
      assert_used: "true"
    config:
      - name: link_entry
        template:
          - "  - {{ .name }}"

  # Attached by the worker class's boundary_crossing_connection_class, never
  # written on an edge. In a real deployment this is where the VLAN id policy
  # would hang.
  - name: crosses_host
    values:
      assert_used: "true"
    config:
      - name: crossing_entry
        template:
          - "{{ .name }} {{ ._clab_src_endpoint }} {{ ._clab_dst_endpoint }}"

groupclass:
  # worker is dot2net's reserved class name for a placement unit. Naming it here
  # is what makes containerlab write one topology file per machine instead of
  # one for the whole network.
  - name: worker
    # Connections that leave a machine get this connection class. Which links
    # those are follows from the subgraphs, so the edges carry no annotation
    # saying it a second time. The same field on an "as" class would mark eBGP.
    boundary_crossing_connection_class: crosses_host
    values:
      assert_used: "true"
    config:
      # The bridges belong to a machine, so this script lands in the machine's
      # own directory and holds only its own bridges.
      - file: host.yaml
        template:
          - "host: {{ .name }}"
          - "nodes:"
          - "{{ .nodes_node_entry }}"
          - "links:"
          - "{{ .connections_link_entry }}"

segmentclass:
  - name: intra
    layer: ip
    params: [vlan_id]
    values:
      assert_used: "true"
      reach: intra-host
    config:
      - name: seg_entry
        template:
          - "{{ .name }} vlan={{ .vlan_id }} reach={{ .reach }}"
  - name: inter
    layer: ip
    params: [vlan_id]
    values:
      assert_used: "true"
      reach: inter-host
    config:
      - name: seg_entry
        template:
          - "{{ .name }} vlan={{ .vlan_id }} reach={{ .reach }}"

networkclass:
  - name: _default
    config:
      - file: segments.txt
        template:
          - "{{ .segments_ip_seg_entry }}"
      # The links no topology file can create, for whoever wires the machines.
      - file: inter-host-links.txt
        template:
          - "{{ .connections_crossing_entry }}"
