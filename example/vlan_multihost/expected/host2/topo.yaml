name: host2
topology:
  nodes:
    br2:
      kind: ovs-bridge
    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r3/etc/frr/frr.conf:/etc/frr/frr.conf
      exec:
      - ip addr add 10.0.0.2/24 dev eth0
      - ip addr add 10.0.2.1/24 dev eth1
    r4:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r4/etc/frr/frr.conf:/etc/frr/frr.conf
      exec:
      - ip addr add 10.0.2.2/24 dev eth0

  links:
  - endpoints: [r3:eth0, br2:eth1]
  - endpoints: [r3:eth1, r4:eth0]

