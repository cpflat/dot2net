nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: net0, type: direct, args: r2#net0}]
    mounts: [host1/r1/frr.conf:/etc/frr/frr.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: net0, type: direct, args: r1#net0}, {name: net1, type: direct, args: r3#net0}]
    mounts: [host1/r2/frr.conf:/etc/frr/frr.conf]
  - name: r3
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: net0, type: direct, args: r2#net1}, {name: net1, type: direct, args: r4#net0}]
    mounts: [host2/r3/frr.conf:/etc/frr/frr.conf]
  - name: r4
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: net0, type: direct, args: r3#net1}]
    mounts: [host2/r4/frr.conf:/etc/frr/frr.conf]

node_configs:
  - name: r1
    cmds:
      - cmd: ip addr add 10.0.0.1/24 dev net0
  - name: r2
    cmds:
      - cmd: ip addr add 10.0.0.2/24 dev net0
      - cmd: ip addr add 10.0.1.1/24 dev net1
  - name: r3
    cmds:
      - cmd: ip addr add 10.0.1.2/24 dev net0
      - cmd: ip addr add 10.0.2.1/24 dev net1
  - name: r4
    cmds:
      - cmd: ip addr add 10.0.2.2/24 dev net0