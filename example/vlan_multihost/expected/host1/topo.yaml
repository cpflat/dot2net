name: host1
topology:
  nodes:
    br1:
      kind: ovs-bridge
    r1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r1/frr.conf:/etc/frr/frr.conf
      exec:
      - ip addr add 10.0.1.1/24 dev eth0
    r2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r2/frr.conf:/etc/frr/frr.conf
      exec:
      - ip addr add 10.0.0.1/24 dev eth0
      - ip addr add 10.0.1.2/24 dev eth1

  links:
  - endpoints: [r2:eth0, br1:eth1]
  - endpoints: [r1:eth0, r2:eth1]

