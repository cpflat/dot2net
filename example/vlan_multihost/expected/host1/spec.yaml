switches:
  - name: br1

nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: r2#eth1}]
    mounts: [$PWD/r1/etc/frr/frr.conf:/etc/frr/frr.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: bridge, args: br1}, {name: eth1, type: direct, args: r1#eth0}]
    mounts: [$PWD/r2/etc/frr/frr.conf:/etc/frr/frr.conf]

node_configs:
  - name: r1
    cmds:
      - cmd: ip addr add 10.0.1.1/24 dev eth0
  - name: r2
    cmds:
      - cmd: ip addr add 10.0.0.1/24 dev eth0
      - cmd: ip addr add 10.0.1.2/24 dev eth1