# A Kathara lab: a shared medium and a point-to-point link.
#
# Kathara is a teaching-oriented emulator whose lab.conf declares, per device,
# which collision domain each of its interfaces sits on. A collision domain is a
# shared medium, which is what dot2net calls a switch node - the same
# deploy: platform node that containerlab emits as a bridge and TiNET as a
# switches: entry. The scenario says nothing Kathara-specific about it.
#
# Two things are Kathara's own and the module enforces them:
#   - interfaces are named ethN after their index in lab.conf, so no other
#     prefix can be asked for
#   - device names are lowercase, at most 30 characters
name: kathara_basic

global:
  path: local

module:
  - kathara

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24

class_policy:
  node:
    default: [router]
  interface:
    default: [default]

nodeclass:
  - name: router
    # The address policy is named here rather than on the interface class, so
    # that the shared medium - which carries no interface_policy - stays
    # addressless and a segment search passes through it.
    interface_policy: [ip]
    config:
      # startup is the name every platform module looks for: containerlab puts
      # it in exec:, TiNET in cmds:, Kathara in <device>.startup. Naming the
      # file here instead would tie the scenario to one of them.
      - name: startup
        template:
          - "{{ .interfaces_ifconf }}"

  # The shared medium. Kathara realizes it as a collision domain, so nothing is
  # deployed for it and it needs no image.
  - name: platform_sw
    deploy: platform

interfaceclass:
  - name: default
    # The interfaces are named ethN, which is dot2net's default and the only
    # thing Kathara accepts: it derives the name from the index in lab.conf and
    # offers no way to change it. Naming another prefix here is rejected.
    config:
      - name: ifconf
        node: router
        template:
          - "ip addr add {{ .ip_addr }}/{{ .ip_plen }} dev {{ .name }}"
          - "ip link set {{ .name }} up"
