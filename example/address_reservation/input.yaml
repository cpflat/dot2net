name: address_reservation

class_policy:
  node:
    base: [all]
  interface:
    default: [default]

# Kathara is not among the modules below: this topology names its interfaces (up1, dn1), and Kathara derives an
# interface's name from its index in lab.conf, so a name of the topology's
# choosing cannot be honoured.
module:
  - assert
  - frr
  - tinet
  - containerlab

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 30
      - name: lo
        type: loopback
        range: 10.255.0.0/24

# The key is mgmt_layer, not management_layer: an unknown key is dropped in
# silence, and this section sat here doing nothing until 2026-08-05.
mgmt_layer:
  name: mgmt
  range: 172.16.0.0/16

param_rule:
  - name: as
    min: 65000
    max: 65535
  - name: vlan
    assign: segment
    layer: ip
    min: 100
    max: 1001
  - name: cname
    assign: connection
    header: conn
    min: 0

nodeclass:
  - name: all
    params: [lo, as]
    values:
      kind: linux
      image: slankdev/frr
    mgmt_interfaceclass: mgmtif
    config:
      - name: frr_cmds
        format: FRRVtyshCLI
        template:
          - ip forwarding
          - int lo
          - ip addr {{ .ip_loopback }}/32
          - router bgp {{ .as }}
          - bgp router-id {{ .ip_loopback }}
          - bgp bestpath as-path multipath-relax
          - bgp bestpath compare-routerid
  - name: router
    config:
      - name: startup
        depends: [frr_cmds]
        template:
          - /usr/lib/frr/frr start
        blocks:
          after: ["self_frr_cmds", "interfaces_mgmt_cmds", "interfaces_router_cmds"]
  - name: server
    config:
      - name: startup
        depends: [frr_cmds]
        template:
          - /usr/lib/frr/frr start
        blocks:
          after: ["self_frr_cmds", "interfaces_mgmt_cmds", "interfaces_server_cmds"]

interfaceclass:
  # The management interface is created without an edge in the topology, from
  # the mgmt_interfaceclass of the node class. Its address has to reach the
  # output, or nothing here is actually verified.
  - name: mgmtif
    values:
      assert_used: "true"
    config:
      - name: mgmt_cmds
        template:
          - "ip addr add {{ .mgmt_addr }}/{{ .mgmt_plen }} dev {{ .name }}"
  - name: default
    params: [ip, vlan, cname]
    config:
      - name: router_cmds
        node: router
        format: FRRVtyshCLI
        template: 
          - int {{ .name }}
          - ip addr {{ .ip_addr }}/30
          - router bgp {{ .node_as }}
          - neighbor {{ .opp_ip_addr }} remote-as {{ .opp_node_as }}
      - name: server_cmds
        node: server
        format: FRRVtyshCLI
        template:
          - int {{ .name }}
          - ip addr {{ .ip_addr }}/30
          - router bgp {{ .node_as }}
          - neighbor {{ .opp_ip_addr }} remote-as external
          - network {{ .ip_net }}

