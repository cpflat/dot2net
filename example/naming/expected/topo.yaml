name: naming
topology:
  nodes:
    spine1:
      kind: linux
      image: alpine
      network-mode: none
      binds:
      - spine1/names.txt:/names.txt

    spine2:
      kind: linux
      image: alpine
      network-mode: none
      binds:
      - spine2/names.txt:/names.txt

    leaf1:
      kind: linux
      image: alpine
      network-mode: none
      binds:
      - leaf1/names.txt:/names.txt

    leaf2:
      kind: linux
      image: alpine
      network-mode: none
      binds:
      - leaf2/names.txt:/names.txt

    br-c8f0ae:
      kind: bridge

  links:
  - endpoints: [spine1:up1, br-c8f0ae:eth0-c8f0ae]
  - endpoints: [spine2:up1, br-c8f0ae:eth1-c8f0ae]
  - endpoints: [leaf1:dn0, br-c8f0ae:eth2-c8f0ae]
  - endpoints: [leaf2:dn0, br-c8f0ae:eth3-c8f0ae]
