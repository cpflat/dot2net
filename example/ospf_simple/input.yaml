name: ospf_simple

class_policy:
  interface:
    default: [default]

global:
  path: local

module_config:
  kathara:
    # Kathara mounts directories rather than files, and the mount replaces
    # what the image had there. Naming /etc/frr says the scenario supplies
    # everything FRR needs in it.
    mount_dirs: [/etc/frr]

module:
  - kathara
  - tinet
  - containerlab

file:
  - name: frr.conf
    path: /etc/frr/frr.conf
  - name: daemons
    path: /etc/frr/daemons
  - name: vtysh.conf
    path: /etc/frr/vtysh.conf

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24
      - name: lo
        type: loopback
        range: 10.0.255.0/24

nodeclass:
  - name: router
    values:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
    policy: [lo]
    config:
      - file: daemons
        sourcefile: ./daemons
        raw: true
      - file: vtysh.conf
        sourcefile: ./vtysh.conf
        raw: true
      - file: frr.conf
        blocks:
          after: ["interfaces_ospf_addr"]
        template:
          - "ip forwarding"
          - "!"
          - "router ospf"
          - " ospf router-id {{ .ip_loopback }}"
          - "{{ .interfaces_ospf_net }}"
          - "!"
      - name: startup
        template: []

interfaceclass:
  - name: default
    policy: [ip]
    config:
      - name: ospf_addr
        template: 
          - "interface {{ .name }}"
          - " ip address {{ .ip_addr }}/{{ .ip_plen }}"
          - "!"
      - name: ospf_net
        template:
          - " network {{ .ip_net }} area 0"
