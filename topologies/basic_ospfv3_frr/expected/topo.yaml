name: ospf
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r1/etc/frr/daemons:/etc/frr/daemons
      - r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth1.rp_filter=0
      - sysctl -w net.ipv6.conf.eth2.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth2.rp_filter=0
      - ip -6 addr add fd00:1234::1/64 dev eth0
      - ip -6 addr add fd00:1234:0:1::1/64 dev eth1
      - ip -6 addr add fd00:1234:0:2::2/64 dev eth2
      - vtysh -c "conf t" -c "router ospf6" -c "ospf6 router-id 10.255.0.1"
      - vtysh -c "conf t" -c "interface eth0" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth1" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth2" -c "ipv6 ospf6 area 0.0.0.0"
    r2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r2/etc/frr/daemons:/etc/frr/daemons
      - r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth1.rp_filter=0
      - ip -6 addr add fd00:1234::2/64 dev eth0
      - ip -6 addr add fd00:1234:0:3::1/64 dev eth1
      - vtysh -c "conf t" -c "router ospf6" -c "ospf6 router-id 10.255.0.2"
      - vtysh -c "conf t" -c "interface eth0" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth1" -c "ipv6 ospf6 area 0.0.0.0"
    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r3/etc/frr/daemons:/etc/frr/daemons
      - r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth1.rp_filter=0
      - sysctl -w net.ipv6.conf.eth2.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth2.rp_filter=0
      - ip -6 addr add fd00:1234:0:1::2/64 dev eth0
      - ip -6 addr add fd00:1234:0:4::1/64 dev eth1
      - ip -6 addr add fd00:1234:0:5::2/64 dev eth2
      - vtysh -c "conf t" -c "router ospf6" -c "ospf6 router-id 10.255.0.3"
      - vtysh -c "conf t" -c "interface eth0" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth1" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth2" -c "ipv6 ospf6 area 0.0.0.0"
    r4:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r4/etc/frr/daemons:/etc/frr/daemons
      - r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - sysctl -w net.ipv6.conf.eth1.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth1.rp_filter=0
      - sysctl -w net.ipv6.conf.eth2.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth2.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth2.rp_filter=0
      - ip -6 addr add fd00:1234:0:3::2/64 dev eth0
      - ip -6 addr add fd00:1234:0:4::2/64 dev eth1
      - ip -6 addr add fd00:1234:0:6::2/64 dev eth2
      - vtysh -c "conf t" -c "router ospf6" -c "ospf6 router-id 10.255.0.4"
      - vtysh -c "conf t" -c "interface eth0" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth1" -c "ipv6 ospf6 area 0.0.0.0"
      - vtysh -c "conf t" -c "interface eth2" -c "ipv6 ospf6 area 0.0.0.0"
    s1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - ip -6 addr add fd00:1234:0:2::1/64 dev eth0
      - ip -6 route replace default via fd00:1234:0:2::2
    s3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - ip -6 addr add fd00:1234:0:5::1/64 dev eth0
      - ip -6 route replace default via fd00:1234:0:5::2
    s4:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      exec:
      - sysctl -w net.ipv6.conf.all.forwarding=1
      - sysctl -w net.ipv6.conf.all.disable_ipv6=0
      - sysctl -w net.ipv6.conf.all.seg6_enabled=1
      - sysctl -w net.ipv4.conf.all.rp_filter=0
      - sysctl -w net.ipv6.conf.default.forwarding=1
      - sysctl -w net.ipv6.conf.default.disable_ipv6=0
      - sysctl -w net.ipv6.conf.default.seg6_enabled=1
      - sysctl -w net.ipv4.conf.default.rp_filter=0
      - sysctl -w net.ipv6.conf.eth0.disable_ipv6=0
      - sysctl -w net.ipv6.conf.eth0.seg6_enabled=1
      - sysctl -w net.ipv4.conf.eth0.rp_filter=0
      - ip -6 addr add fd00:1234:0:6::1/64 dev eth0
      - ip -6 route replace default via fd00:1234:0:6::2

  links:
  - endpoints: [r1:eth0, r2:eth0]
  - endpoints: [r1:eth1, r3:eth0]
  - endpoints: [s1:eth0, r1:eth2]
  - endpoints: [r2:eth1, r4:eth0]
  - endpoints: [r3:eth1, r4:eth1]
  - endpoints: [s3:eth0, r3:eth2]
  - endpoints: [s4:eth0, r4:eth2]
