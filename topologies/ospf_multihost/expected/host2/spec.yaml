switches:
  - name: br2

nodes:
  - name: r3
    image: quay.io/frrouting/frr:8.5.4
    interfaces: [{name: eth0, type: bridge, args: br2}, {name: eth1, type: direct, args: r4#eth0}]
    mounts: [$PWD/r3/etc/frr/frr.conf:/etc/frr/frr.conf, $PWD/r3/etc/frr/daemons:/etc/frr/daemons, $PWD/r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r4
    image: quay.io/frrouting/frr:8.5.4
    interfaces: [{name: eth0, type: direct, args: r3#eth1}]
    mounts: [$PWD/r4/etc/frr/frr.conf:/etc/frr/frr.conf, $PWD/r4/etc/frr/daemons:/etc/frr/daemons, $PWD/r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]

node_configs:
  - name: r3
    cmds:
  - name: r4
    cmds: