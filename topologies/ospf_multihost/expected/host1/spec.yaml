switches:
  - name: br1

nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.4
    interfaces: [{name: eth0, type: direct, args: r2#eth1}]
    mounts: [$PWD/r1/etc/frr/frr.conf:/etc/frr/frr.conf, $PWD/r1/etc/frr/daemons:/etc/frr/daemons, $PWD/r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.4
    interfaces: [{name: eth0, type: bridge, args: br1}, {name: eth1, type: direct, args: r1#eth0}]
    mounts: [$PWD/r2/etc/frr/frr.conf:/etc/frr/frr.conf, $PWD/r2/etc/frr/daemons:/etc/frr/daemons, $PWD/r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]

node_configs:
  - name: r1
    cmds:
      - cmd: touch /var/log/frr.log
      - cmd: chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
  - name: r2
    cmds:
      - cmd: touch /var/log/frr.log
      - cmd: chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"