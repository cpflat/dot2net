# One shared segment reaching two machines, and what it costs to leave a machine.
#
# Four routers share one segment; two of them sit on each machine. A link that
# leaves a machine costs a VLAN from a finite pool, so the number of them is
# what this topology is about.
#
#   without aggregation:  r3 and r4 each need a link to sw1 on the other
#                         machine, so the segment costs 2 crossings - and n of
#                         them for n members over there
#   with aggregation:     each machine gets its own bridge, the bridges are
#                         joined, and the segment costs 1 crossing whatever n is
#
# It is on by default; set global.aggregate_crossing_links: false to see the
# first form. The addresses do not move either way: bridges carry none, so a
# search for a segment passes through them and all four routers stay in one /24.
#
# Deploying it takes nothing by hand: each machine's entry script makes its own
# bridge and takes it down again. The bridge is called sw1 in the model, but the
# machine sees a short name ending in a hash - a name on a machine has fifteen
# characters and has to tell one lab's bridge from another's. Write
# {{ .clab_bridge }} for it; {{ .name }} is the model's name and not what the
# machine calls it.
name: aggregate_crossing

global:
  path: local
  # One directory per machine, so a machine's files pack as a unit. containerlab
  # needs this to be the worker class: it resolves bind paths relative to the
  # directory holding the topology file.
  output_group_class: worker

# Kathara is here too: a lab.conf describes one machine, and this topology is
# split into one directory per machine, so each gets its own.
module_config:
  # The bridges this topology names have to exist before containerlab will
  # deploy, and the entry script is what makes them. Without it the lab cannot
  # be brought up from the generated files alone.
  containerlab:
    generate_scripts: true
  tinet:
    generate_scripts: true
  kathara:
    # dot2net supplies everything FRR needs in here.
    mount_dirs: [/etc/frr]
    generate_scripts: true

module:
  - frr
  - kathara
  - tinet
  - containerlab

file:
  - name: frr.conf
    path: /etc/frr/frr.conf
  - name: daemons
    path: /etc/frr/daemons
  - name: vtysh.conf
    path: /etc/frr/vtysh.conf
  - name: inter-host-links.txt
    scope: network

class_policy:
  interface:
    default: [default]
  connection:
    default: [link]

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24
      - name: lo
        type: loopback
        range: 10.0.255.0/24

nodeclass:
  - name: router
    use: [frrLogFile]
    # The address policy is named here rather than on the interface class, so
    # that the bridge - which carries no interface_policy - stays addressless.
    interface_policy: [ip]
    policy: [lo]
    values:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
    config:
      - file: daemons
        sourcefile: ./daemons
        raw: true
      - file: vtysh.conf
        sourcefile: ./vtysh.conf
        raw: true
      # Identical to example/ospf_simple. The addresses are set by zebra from
      # this file, so no exec commands are needed.
      - file: frr.conf
        blocks:
          after: ["interfaces_ospf_addr"]
        template:
          - "ip forwarding"
          - "!"
          - "router ospf"
          - " ospf router-id {{ .ip_loopback }}"
          - "{{ .interfaces_ospf_net }}"
          - "!"
      - name: startup
        template: []

  # Provided by the platform, so no container is generated for it: it carries
  # the kind alone, whose value containerlab owns and dot2net passes through.
  - name: platform_sw
    deploy: platform
    values:
      kind: ovs-bridge
    # containerlab refuses to deploy when the bridge does not already exist.
    # clabOvsBridgeSetup is a ready-made class the containerlab module offers:
    # it writes the entry script's worker_deploy and worker_destroy, so the
    # bridge is made before the lab comes up and removed after it goes down. A
    # lab whose bridges are provisioned by Ansible, or need sudo, or live in
    # another OVS database, leaves the use: line out and writes its own.
    use: [clabOvsBridgeSetup]

interfaceclass:
  - name: default
    config:
      # Only routers are addressed. The bridge is layer-unaware, which is also
      # what lets a search for a segment look through it.
      - name: ospf_addr
        node: router
        template:
          - "interface {{ .name }}"
          - " ip address {{ .ip_addr }}/{{ .ip_plen }}"
          - "!"
      - name: ospf_net
        node: router
        template:
          - " network {{ .ip_net }} area 0"

connectionclass:
  - name: link

  # Attached by the worker class's boundary_crossing_connection_class, never
  # written on an edge.
  - name: crosses_host
    config:
      - name: crossing_entry
        template:
          - "{{ .name }} {{ ._clab_src_endpoint }} {{ ._clab_dst_endpoint }}"

groupclass:
  # worker is dot2net's reserved class name for a placement unit. Naming it is
  # what makes containerlab write one topology file per machine.
  - name: worker
    # Connections that leave a machine get this connection class. Which links
    # those are follows from the subgraphs, so the edges carry no annotation
    # saying it a second time.
    boundary_crossing_connection_class: crosses_host

networkclass:
  - name: _default
    config:
      # The links no topology file can create, for whoever wires the machines.
      #
      # Both ends name the same bridge, and that is not a mistake: one segment
      # becomes one bridge per machine, and a machine only ever sees its own, so
      # they are given the same name. What the line does not say is which
      # machine each end is on - the machines are listed in the order their
      # groups are named in the DOT file.
      - file: inter-host-links.txt
        template:
          - "# connection, and the two bridge ports to join, one per machine"
          - "{{ .connections_crossing_entry }}"
