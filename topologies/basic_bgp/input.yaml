name: bgp

class_policy:
  node:
    default: [default]
  interface:
    default: [default]

module_config:
  kathara:
    # Kathara mounts directories rather than files, and the mount replaces
    # what the image had there. Naming /etc/frr says the topology supplies
    # everything FRR needs in it.
    mount_dirs: [/etc/frr]

module:
  - kathara
  - frr
  - tinet
  - containerlab

file:
  - name: daemons
    path: /etc/frr/daemons
  - name: vtysh.conf
    path: /etc/frr/vtysh.conf

layer:
  - name: ip
    default_connect: true
    policy:
      - name: ip
        range: 10.0.0.0/16
        prefix: 24
      - name: lo
        type: loopback
        range: 10.255.0.0/24

param_rule:
  - name: as
    min: 65000
    max: 65535

nodeclass:
  - name: default
    use: [frrLogFile]
    params: [lo]
    values:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
    config:
      - file: daemons
        sourcefile: ./daemons
        raw: true
      - file: vtysh.conf
        sourcefile: ./vtysh.conf
        raw: true
      - name: startup
        depends: [frr_cmds]
        blocks:
          before: ["self_frr_cmds", "interfaces_frr_cmds"]
      - name: frr_cmds
        format: FRRVtyshCLI
        template:
          - router bgp {{ .group_as }}
          - bgp router-id {{ .ip_loopback }}

interfaceclass:
  - name: default
    params: [ip]
    config:
      - name: frr_cmds
        format: FRRVtyshCLI
        template:
          - int {{ .name }}
          - ip addr {{ .ip_addr }}/{{ .ip_plen }}
          - router bgp {{ .group_as }}
          - neighbor {{ .opp_ip_addr }} remote-as {{ .opp_group_as }}

groupclass:
  - name: as
    params: [as]

