nodes:
  - name: r1
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: r2#eth0}]
    mounts: [$PWD/r1/etc/frr/daemons:/etc/frr/daemons, $PWD/r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]
  - name: r2
    image: quay.io/frrouting/frr:8.5.0
    interfaces: [{name: eth0, type: direct, args: r1#eth0}]
    mounts: [$PWD/r2/etc/frr/daemons:/etc/frr/daemons, $PWD/r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf]

node_configs:
  - name: r1
    cmds:
      - cmd: touch /var/log/frr.log
      - cmd: chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - cmd: vtysh -c "conf t" -c "router bgp 65000" -c "bgp router-id 10.255.0.1"
      - cmd: vtysh -c "conf t" -c "int eth0" -c "ip addr 10.0.0.1/24" -c "router bgp 65000" -c "neighbor 10.0.0.2 remote-as 65001"
  - name: r2
    cmds:
      - cmd: touch /var/log/frr.log
      - cmd: chown frr:frr /var/log/frr.log
      - cmd: vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - cmd: vtysh -c "conf t" -c "router bgp 65001" -c "bgp router-id 10.255.0.2"
      - cmd: vtysh -c "conf t" -c "int eth0" -c "ip addr 10.0.0.2/24" -c "router bgp 65001" -c "neighbor 10.0.0.1 remote-as 65000"