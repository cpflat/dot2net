name: ospf_simple
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
      network-mode: none
      binds:
      - r1/etc/frr/frr.conf:/etc/frr/frr.conf
      - r1/etc/frr/daemons:/etc/frr/daemons
      - r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
      network-mode: none
      binds:
      - r2/etc/frr/frr.conf:/etc/frr/frr.conf
      - r2/etc/frr/daemons:/etc/frr/daemons
      - r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.4
      network-mode: none
      binds:
      - r3/etc/frr/frr.conf:/etc/frr/frr.conf
      - r3/etc/frr/daemons:/etc/frr/daemons
      - r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"

  links:
  - endpoints: [r1:eth0, r2:eth0]
  - endpoints: [r2:eth1, r3:eth0]
