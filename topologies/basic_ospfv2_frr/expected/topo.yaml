name: ospf
topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r1/etc/frr/daemons:/etc/frr/daemons
      - r1/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.1/30 dev eth0
      - ip addr add 10.0.0.5/30 dev eth1
      - ip addr add 10.0.0.10/30 dev eth2
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.0/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.4/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.8/30 area 0"
    r2:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r2/etc/frr/daemons:/etc/frr/daemons
      - r2/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.2/30 dev eth0
      - ip addr add 10.0.0.13/30 dev eth1
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.0/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.12/30 area 0"
    r3:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r3/etc/frr/daemons:/etc/frr/daemons
      - r3/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.6/30 dev eth0
      - ip addr add 10.0.0.17/30 dev eth1
      - ip addr add 10.0.0.22/30 dev eth2
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.4/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.16/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.20/30 area 0"
    r4:
      kind: linux
      image: quay.io/frrouting/frr:8.5.0
      network-mode: none
      binds:
      - r4/etc/frr/daemons:/etc/frr/daemons
      - r4/etc/frr/vtysh.conf:/etc/frr/vtysh.conf
      exec:
      - touch /var/log/frr.log
      - chown frr:frr /var/log/frr.log
      - vtysh -c "conf t" -c "log file /var/log/frr.log informational"
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.14/30 dev eth0
      - ip addr add 10.0.0.18/30 dev eth1
      - ip addr add 10.0.0.26/30 dev eth2
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.12/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.16/30 area 0"
      - vtysh -c "conf t" -c "router ospf" -c "network 10.0.0.24/30 area 0"
    s1:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.9/30 dev eth0
      - ip route replace default via 10.0.0.10
    s3:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.21/30 dev eth0
      - ip route replace default via 10.0.0.22
    s4:
      kind: linux
      image: nicolaka/netshoot
      network-mode: none
      exec:
      - /usr/lib/frr/frr start
      - ip addr add 10.0.0.25/30 dev eth0
      - ip route replace default via 10.0.0.26

  links:
  - endpoints: [r1:eth0, r2:eth0]
  - endpoints: [r1:eth1, r3:eth0]
  - endpoints: [s1:eth0, r1:eth2]
  - endpoints: [r2:eth1, r4:eth0]
  - endpoints: [r3:eth1, r4:eth1]
  - endpoints: [s3:eth0, r3:eth2]
  - endpoints: [s4:eth0, r4:eth2]
